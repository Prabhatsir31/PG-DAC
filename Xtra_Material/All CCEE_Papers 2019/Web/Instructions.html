	function validateForm() {

		var examName = 'PGDAC';
		var paperCode = 'D4';

		var returnVal = false;

		$
				.ajax({
					type : "POST",
					async : false,
					url : "checkPaperAvailable",
					data : "examName=" + examName + "&paperCode=" + paperCode,
					dataType : "text",

					success : function(response) {
						if (response == '0') {
							alert('Paper has not been made available by CI. Kindly wait for instructions from the invigilator.');

						} else if (response == '2') {
							alert('Could not fetch availability of paper. Paper might have been ended.');

						} else {
							returnVal = true;
						}
					},
					error : function(jqXHR, textStatus, errorThrown) {
						if (jqXHR.status === 0) {
							alert('Not connected.\nVerify Network.');

						} else if (jqXHR.status == 404) {
							alert('Requested page not found. [404]');

						} else if (jqXHR.status == 500) {
							alert('Internal Server Error [500].');

						} else if (exception === 'parsererror') {
							alert('Requested JSON parse failed.');

						} else if (exception === 'timeout') {
							alert('Time out error.');

						} else if (exception === 'abort') {
							alert('Ajax request aborted.');

						} else {
							alert('Uncaught Error.\n' + jqXHR.responseText);
						}
						returnVal = false;
					}
				});
		return returnVal;
	}
</script>
