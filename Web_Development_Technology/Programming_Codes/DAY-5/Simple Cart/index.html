<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🛒 Add Book to Cart</h1>
    <form id="productForm">
      <input type="text" id="pname" placeholder="Product Name" required />
      <input type="number" id="pprice" placeholder="Price" required />
      <input type="number" id="pqty" placeholder="Quantity" required />
      <button type="submit">Add to Cart</button>
    </form>

    <h2>🧾 Cart</h2>
    <table id="cart">
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <h3 id="total">Total: ₹0</h3>
  </div>

  <script src="script.js"></script>
</body>
</html>
