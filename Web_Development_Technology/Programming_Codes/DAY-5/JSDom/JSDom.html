<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS DOM Copy</title>
</head>
<body>
  <form name="frm" action="a.html" method="get" onsubmit="return true">
    <label for="t1">Name:</label>
    <input type="text" name="t1" id="t1" placeholder="Enter your name" />
    <input type="button" value="Copy" onclick="call()" />

    <label for="t2">Copied Name:</label>
    <input type="text" name="t2" id="t2" readonly />

    <input type="submit" value="Submit">
  </form>

  
</body>

<script src="script.js"></script>
</html>
