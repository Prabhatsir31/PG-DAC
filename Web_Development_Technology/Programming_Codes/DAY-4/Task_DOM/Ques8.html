<!-- Q8. Print current date on screen -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Current Date</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #dateDisplay {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <p id="dateDisplay"></p>
    <script>
        document.getElementById("dateDisplay").textContent = new Date().toDateString();
    </script>
</body>
</html>
