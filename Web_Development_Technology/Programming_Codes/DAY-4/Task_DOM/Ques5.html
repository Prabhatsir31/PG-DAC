<!-- Q5. Write your name using H1 and align centre onmouse over change alignment to left. -->

<!DOCTYPE html>
<html lang="en">
<head>
<title>Name Alignment</title>
<style>
    #myName {
        text-align: center;
        color: navy;
        font-family: Arial, Helvetica, sans-serif;
    }
</style>
</head>
<body>
    <h1 id="myName">Prabhat Srivastava</h1>
    <script>
        const heading = document.getElementById("myName");
        heading.onmouseover = () => heading.style.textAlign = "left";
        heading.onmouseout = () => heading.style.textAlign = "center";

    </script>
</body>
</html>
