<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <form id="loginForm">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username">
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br>
        <button type="submit">Get Token</button>
    </form>

    <script>
        // Listen to form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent the default form submission

            // Get form data
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            
            alert("Username: " + username);
            alert("Password: " + password);

            // Prepare data for sending via fetch
            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);

            // Send an AJAX request using fetch API
            fetch('/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: formData.toString() // Convert URLSearchParams to string
            })
            .then(response => response.json())  // Parse the JSON response
            .then(data => {
                console.log("JWT Token:", data);
                alert(data.token);  // Assuming the response contains a `token` key
                
                // Redirect to the welcome page with the token as query parameter
                window.location.href = "/welcome?token=" + data.token;
                alert("Redirecting to welcome page...");
            })
            .catch(error => {
                console.error('Error:', error);  // Log any errors
                alert('Error occurred: ' + error.message);
            });
        });
    </script>
</body>
</html>
